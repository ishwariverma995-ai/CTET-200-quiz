let subject='', idx=0, score=0, answered=false, answers=[];
const names=Object.keys(DATA);
const box=document.getElementById('subjects');
names.forEach(n=>{let b=document.createElement('button');b.className='sub';b.textContent=n+' • 50 Q';b.onclick=()=>start(n);box.appendChild(b)});

function start(s){subject=s;idx=0;score=0;answers=Array(50).fill(null);homeHide();render();}
function homeHide(){document.getElementById('home').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden')}
function render(){
 let d=DATA[subject][idx]; document.getElementById('subjectTitle').textContent=subject;
 document.getElementById('qnum').textContent=`Question ${idx+1} / 50`;
 document.getElementById('bar').style.width=((idx+1)/50*100)+'%';
 document.getElementById('question').textContent=d.q;
 const op=document.getElementById('options');op.innerHTML='';
 document.getElementById('feedback').textContent='';document.getElementById('concept').classList.add('hidden');
 answered=answers[idx]!==null;
 d.options.forEach((x,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+x;b.onclick=()=>choose(i);op.appendChild(b)});
 if(answered) showAnswer(answers[idx]);
}
function choose(i){if(answered)return;answered=true;answers[idx]=i;if(i===DATA[subject][idx].answer)score++;showAnswer(i)}
function showAnswer(i){
 let d=DATA[subject][idx], bs=document.querySelectorAll('.option');
 bs.forEach((b,k)=>{if(k===d.answer)b.classList.add('correct'); if(k===i&&i!==d.answer)b.classList.add('wrong')});
 document.getElementById('feedback').textContent=i===d.answer?'🟢 WELL DONE! सही उत्तर':'🔴 WRONG! सही उत्तर हरे रंग में है';
 document.getElementById('concept').textContent='💡 Concept: '+d.concept;document.getElementById('concept').classList.remove('hidden');
}
function nextQ(){if(idx<49){idx++;render()}else finish()}
function prevQ(){if(idx>0){idx--;render()}}
function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('score').textContent=score+'/50';document.getElementById('details').textContent=`Correct: ${score} • Wrong: ${50-score} • Percentage: ${score*2}%`}
function retry(){start(subject)}
function home(){document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}
</script></body></html>
