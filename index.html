<script>
const D=[{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"वाइगोत्स्की के अनुसार सहायता से बच्चा जो कर सकता है, वह किस क्षेत्र से जुड़ा है?","opts":["निकटस्थ विकास क्षेत्र","परिपक्वता स्तर","स्थिर बुद्धि","स्मृति स्तर"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"निर्माणवादी कक्षा में शिक्षक की प्रमुख भूमिका क्या है?","opts":["सुविधादाता","एकमात्र वक्ता","केवल परीक्षक","दंडाधिकारी"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"निदानात्मक आकलन का मुख्य उद्देश्य क्या है?","opts":["सीखने की कठिनाई पहचानना","रैंक बनाना","अंतिम प्रमाणपत्र देना","उपस्थिति लेना"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"रचनात्मक आकलन कब सबसे उपयोगी होता है?","opts":["सीखने के दौरान","केवल वर्ष के अंत में","प्रवेश से पहले ही","विद्यालय छोड़ने पर"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"आंतरिक प्रेरणा का उदाहरण क्या है?","opts":["रुचि के कारण पढ़ना","इनाम के लिए पढ़ना","डाँट से बचना","अंक के डर से पढ़ना"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"विकासात्मक मानसिकता वाला शिक्षक क्या कहेगा?","opts":["अभी यह नहीं आया, अभ्यास से बेहतर होगा","तुम यह कभी नहीं कर सकते","तुम जन्म से कमजोर हो","यह विषय छोड़ दो"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"समावेशी शिक्षा का मूल विचार क्या है?","opts":["सभी बच्चों को साथ सीखने के अवसर देना","कमजोर बच्चों को अलग करना","केवल तेज बच्चों को पढ़ाना","दिव्यांग बच्चों को हमेशा अलग रखना"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"मेटाकॉग्निशन का उदाहरण कौन-सा है?","opts":["अपनी सीखने की रणनीति पर विचार करना","उत्तर नकल करना","केवल पुस्तक पढ़ना","सिर्फ अंक देखना"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"सहपाठी शिक्षण का एक लाभ क्या है?","opts":["बच्चों को एक-दूसरे से समझाने का अवसर मिलता है","शिक्षक की जरूरत हमेशा समाप्त हो जाती है","गलतियाँ समाप्त हो जाती हैं","केवल तेज बच्चे सीखते हैं"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"पोर्टफोलियो किसका प्रमाण बेहतर देता है?","opts":["समय के साथ प्रगति","एक दिन की उपस्थिति","केवल अंतिम अंक","केवल लिखावट"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"उच्च-स्तरीय प्रश्न में सामान्यतः क्या चाहिए?","opts":["तर्क और प्रमाण","केवल हाँ/नहीं","सिर्फ परिभाषा","केवल नकल"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"बच्चे की गलती को शिक्षक को किस रूप में देखना चाहिए?","opts":["सीखने की स्थिति का संकेत","दंड का कारण","बुद्धि का स्थायी प्रमाण","कक्षा से निकालने का कारण"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"यदि दो बच्चे एक समस्या के अलग सही तरीके देते हैं, तो शिक्षक को क्या करना चाहिए?","opts":["दोनों रणनीतियों की तुलना करानी चाहिए","एक को बिना कारण गलत कहना चाहिए","सिर्फ तेज तरीका स्वीकारना चाहिए","चर्चा रोक देनी चाहिए"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"पूर्व-आकलन का उपयोग किसलिए किया जाता है?","opts":["पूर्वज्ञान जानने के लिए","अंतिम ग्रेड देने के लिए","रैंक बनाने के लिए","प्रमाणपत्र देने के लिए"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"प्रभावी फीडबैक कैसा होना चाहिए?","opts":["विशिष्ट और सुधार के अगले कदम से जुड़ा","केवल 'अच्छा'","बहुत देर से दिया हुआ","सिर्फ तुलना वाला"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"बाल-केंद्रित शिक्षण में प्राथमिकता किसे मिलती है?","opts":["बच्चे की सक्रिय भागीदारी","केवल शिक्षक का भाषण","केवल पाठ्यपुस्तक","केवल परीक्षा"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"बहुभाषी कक्षा में मातृभाषा का उपयोग क्या कर सकता है?","opts":["अर्थ-निर्माण में सहायता","सीखना हमेशा रोक देता है","बुद्धि घटाता है","परीक्षा समाप्त करता है"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"सहकारी अधिगम में क्या आवश्यक है?","opts":["साझी जिम्मेदारी और व्यक्तिगत जवाबदेही","एक बच्चा पूरा काम करे","भूमिका अस्पष्ट हो","केवल प्रतियोगिता हो"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"बच्चे की क्षमता को केवल एक परीक्षा से मापने की सीमा क्या है?","opts":["प्रदर्शन का सीमित नमूना मिलता है","परीक्षा कभी उपयोगी नहीं","अंक हमेशा गलत","बच्चे कभी तैयारी नहीं करते"],"ans":0},{"section":"बाल विकास एवं शिक्षाशास्त्र","q":"कक्षा में प्रतीक्षा समय बढ़ाने का लाभ क्या है? ून की अनदेखी"],"ans":0},{"section":"सामाजिक विज्ञान","q":"कक्षा में दो ऐतिहासिक स्रोतों के अंतर की तुलना कराना किस कौशल को बढ़ाता है?","opts":["स्रोत-विश्लेषण और आलोचनात्मक सोच","केवल तारीख स्मरण","नकल","सुलेख"],"ans":0},{"section":"सामाजिक विज्ञान","q":"इतिहास में सामान्य लोगों के अनुभवों को पढ़ना क्यों महत्वपूर्ण है?","opts":["घटनाओं के सामाजिक प्रभाव को समझने के लिए","केवल राजाओं के नाम याद करने के लिए","नक्शा रंगने के लिए","केवल तिथियाँ लिखने के लिए"],"ans":0},{"section":"सामाजिक विज्ञान","q":"सामाजिक विज्ञान की बहस में अच्छा नियम क्या है?","opts":["दावे के साथ कारण/प्रमाण देना और सम्मान रखना","व्यक्ति पर हमला करना","केवल जोर से बोलना","दूसरी राय रोकना"],"ans":0},{"section":"सामाजिक विज्ञान","q":"स्थानीय मानचित्र बनवाने से कौन-सा कौशल विकसित होता है?","opts":["स्थानिक समझ और मानचित्र कौशल","केवल वर्तनी","केवल स्मरण","केवल चित्रकारी"],"ans":0},{"section":"सामाजिक विज्ञान","q":"शिक्षा और स्वास्थ्य सुविधाओं में सुधार से मानव विकास पर क्या प्रभाव पड़ सकता है?","opts":["अवसर बढ़ सकते हैं","विकास हमेशा घटेगा","रोजगार समाप्त होगा","जनसंख्या शून्य होगी"],"ans":0},{"section":"सामाजिक विज्ञान","q":"किसी नीति के प्रभाव को अलग-अलग सामाजिक समूहों के दृष्टिकोण से देखना क्या बढ़ाता है?","opts":["बहु-दृष्टिकोण समझ","केवल एक राय","केवल रटना","केवल नकल"],"ans":0},{"section":"सामाजिक विज्ञान","q":"भूगोल में संसाधनों के असमान वितरण को समझने के लिए क्या उपयोगी है?","opts":["मानचित्र, आँकड़े और स्थानीय उदाहरण","केवल एक चित्र","केवल कविता","केवल उपस्थिति"],"ans":0},{"section":"सामाजिक विज्ञान","q":"यदि विद्यार्थी पूछे कि किसी ऐतिहासिक निर्णय से आम लोगों पर क्या प्रभाव पड़ा, तो शिक्षक किस दृष्टिकोण को बढ़ा रहा है?","opts":["जन-केंद्रित इतिहास दृष्टि","केवल शासक-केंद्रित दृष्टि","केवल तिथि स्मरण","केवल मानचित्र पाठ"],"ans":0},{"section":"सामाजिक विज्ञान","q":"सामाजिक विज्ञान में स्थानीय उदाहरण देने का लाभ क्या है?","opts":["अमूर्त अवधारणाओं को अनुभव से जोड़ना","विषय हटाना","इतिहास रोकना","आकलन समाप्त करना"],"ans":0},{"section":"सामाजिक विज्ञान","q":"नागरिक को सरकारी सूचना तक पहुँच का अधिकार किस लोकतांत्रिक मूल्य से जुड़ा है?","opts":["पारदर्शिता","गोपनीयता","एकाधिकार","असमानता"],"ans":0},{"section":"सामाजिक विज्ञान","q":"यदि ग्राम पंचायत के विकास कार्य की सार्वजनिक समीक्षा होती है, तो यह किसका उदाहरण है?","opts":["सामाजिक जवाबदेही","निजी व्यापार","प्राकृतिक आपदा","भौगोलिक अपरदन"],"ans":0}];let list=D,i=0,score=0,answered=[],section=null;const $=x=>document.getElementById(x);
function makeTabs(){let ns=[...new Set(D.map(x=>x.section))];$('tabs').innerHTML='<button class="active" onclick="setSec(null,this)">सभी (200)</button>'+ns.map(n=>'<button onclick="setSec('+JSON.stringify(n)+',this)">'+n+'</button>').join('')}
function setSec(s,b){section=s;list=s?D.filter(x=>x.section===s):D;i=0;score=0;answered=new Array(list.length).fill(null);document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('result').style.display='none';$('card').style.display='block';draw()}
function draw(){let x=list[i];$('qno').textContent='प्रश्न '+(i+1)+' / '+list.length+' • '+x.section;$('question').textContent=x.q;$('options').innerHTML='';x.opts.forEach((o,n)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+n)+'. '+o;b.onclick=()=>answer(n);$('options').appendChild(b)});if(answered[i]!==null)show(answered[i]);else $('explain').style.display='none';$('prev').disabled=i===0;$('next').textContent=i===list.length-1?'परिणाम देखें ▶':'अगला ▶'}
function answer(n){if(answered[i]!==null)return;answered[i]=n;if(n===list[i].ans)score++;show(n)}
function show(n){let x=list[i];[...$('options').children].forEach((b,k)=>{b.disabled=true;if(k===x.ans)b.classList.add('correct');if(k===n&&n!==x.ans)b.classList.add('wrong')});$('explain').innerHTML='<b>सही उत्तर:</b> '+String.fromCharCode(65+x.ans)+'. '+x.opts[x.ans];$('explain').style.display='block'}
$('prev').onclick=()=>{if(i>0){i--;draw()}};$('next').onclick=()=>{if(answered[i]===null){alert('पहले उत्तर चुनिए।');return}if(i<list.length-1){i++;draw()}else finish()};
function finish(){$('card').style.display='none';let p=Math.round(score/list.length*100);$('result').style.display='block';$('score').textContent='आपका स्कोर: '+score+' / '+list.length+' ('+p+'%)';$('detail').textContent=p>=80?'बहुत अच्छा प्रदर्शन! 🎉':p>=60?'अच्छा प्रयास! गलत प्रश्नों की पुनरावृत्ति करें। 👍':'अभ्यास जारी रखें और अवधारणाओं को दोबारा पढ़ें। 📖';$('bar').style.width=p+'%'}
function restart(){i=0;score=0;answered=new Array(list.length).fill(null);$('result').style.display='none';$('card').style.display='block';draw()}makeTabs();draw();
</script></body></html>
