const home=document.getElementById('home'),panel=document.getElementById('panel');
Object.keys(DB).forEach((c,i)=>{let b=document.createElement('button');b.className='card c'+(i+1);b.innerHTML='📘 कक्षा '+c;b.onclick=()=>showClass(c);document.getElementById('classes').appendChild(b)});
function showClass(c){home.style.display='none';panel.style.display='block';panel.innerHTML='<button class="back" onclick="goHome()">← कक्षाएँ</button><h2>📘 कक्षा '+c+'</h2><div class="list">'+Object.keys(DB[c]).map(s=>'<div class="item" onclick="showSub('+JSON.stringify(c)+','+JSON.stringify(s)+')">📚 '+s+' <span>›</span></div>').join('')+'</div>'}
function showSub(c,s){panel.innerHTML='<button class="back" onclick="showClass('+JSON.stringify(c)+')">← विषय</button><h2>📖 '+s+'</h2><div class="list">'+Object.keys(DB[c][s]).map(ch=>'<div class="item" onclick="showCh('+JSON.stringify(c)+','+JSON.stringify(s)+','+JSON.stringify(ch)+')">📌 '+ch+'</div>').join('')+'</div>'}
function showCh(c,s,ch){let qs=DB[c][s][ch];panel.innerHTML='<button class="back" onclick="showSub('+JSON.stringify(c)+','+JSON.stringify(s)+')">← अध्याय</button><h2>⭐ '+ch+'</h2><div>'+qs.map((x,i)=>'<div class="qa"><b>Q'+(i+1)+'. '+x.q+'</b><div class="opts">'+x.o.map((o,j)=>'<div class="opt '+(j===x.a?'correct':'')+'">'+String.fromCharCode(65+j)+'. '+o+(j===x.a?' 🟢 सही उत्तर':'')+'</div>').join('')+'</div><div class="exp">💡 <b>सरल Concept:</b> '+x.e+'</div></div>').join('')+'</div>'}
function goHome(){panel.style.display='none';home.style.display='block'}
function search(){let q=document.getElementById('search').value.toLowerCase().trim();if(!q){goHome();return}home.style.display='none';panel.style.display='block';let out=[];for(let c in DB)for(let s in DB[c])for(let ch in DB[c][s])if((c+' '+s+' '+ch).toLowerCase().includes(q))out.push([c,s,ch]);panel.innerHTML='<button class="back" onclick="goHome()">← Home</button><h2>🔎 परिणाम</h2><div class="list">'+(out.length?out.map(x=>'<div class="item" onclick="showCh('+x.map(JSON.stringify).join(',')+')">📘 कक्षा '+x[0]+' › '+x[1]+' › '+x[2]+'</div>').join(''):'<p>कोई परिणाम नहीं मिला।</p>')+'</div>'}
